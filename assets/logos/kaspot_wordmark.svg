<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 170" width="100%" height="100%">
  <defs>
    <!-- Deep Cobalt Blue for 'Ka' -->
    <linearGradient id="kaGradWm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E5EBF"/>
      <stop offset="100%" stop-color="#1954AB"/>
    </linearGradient>

    <!-- Vibrant Sky Blue for 'Spot' -->
    <linearGradient id="spotGradWm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#1A85E6"/>
    </linearGradient>

    <filter id="softGlowWm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1A85E6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g transform="translate(10, 5)">
    <!-- Letter 'K' -->
    <rect x="0" y="24" width="22" height="104" rx="11" fill="url(#kaGradWm)"/>
    <path d="M 18 80 L 58 35 C 64 28 75 30 79 38 L 81 43 C 85 51 83 60 76 67 L 44 98 Z" fill="url(#kaGradWm)"/>
    <path d="M 32 86 L 73 120 C 80 126 80 137 73 143 L 70 145 C 63 151 52 150 46 143 L 16 102 Z" fill="url(#kaGradWm)"/>

    <!-- Letter 'a' -->
    <path d="M 124 64 C 101 64 85 81 85 104 C 85 127 101 144 124 144 C 137 144 148 138 154 128 L 154 135 C 154 140 158 144 163 144 C 168 144 172 140 172 135 L 172 75 C 172 69 168 64 162 64 C 157 64 154 67 154 72 L 154 80 C 148 70 137 64 124 64 Z 
             M 128 84 C 141 84 153 94 153 104 C 153 114 141 124 128 124 C 105 124 105 114 105 104 C 105 94 115 84 128 84 Z" 
          fill="url(#kaGradWm)"/>

    <!-- Letter 'S' -->
    <path d="M 235 68 C 228 64 218 63 209 63 C 187 63 175 75 175 90 C 175 105 186 112 203 117 C 219 122 225 125 225 132 C 225 138 219 144 207 144 C 196 144 186 138 181 133 C 177 129 171 130 167 134 L 165 136 C 161 140 162 147 167 151 C 176 159 191 164 207 164 C 231 164 246 151 246 133 C 246 117 234 110 217 105 C 201 100 196 97 196 90 C 196 85 201 81 210 81 C 219 81 226 84 231 88 C 236 91 242 90 246 86 L 248 84 C 252 79 251 72 246 68 Z" 
          fill="url(#spotGradWm)" transform="translate(10, -18)"/>

    <!-- Letter 'p' -->
    <path d="M 272 64 C 267 64 263 68 263 73 L 263 167 C 263 172 267 176 272 176 C 277 176 281 172 281 167 L 281 128 C 287 138 298 144 311 144 C 334 144 350 127 350 104 C 350 81 334 64 311 64 C 298 64 287 70 281 80 L 281 73 C 281 68 277 64 272 64 Z 
             M 307 84 C 320 84 330 94 330 104 C 330 114 320 124 307 124 C 294 124 282 114 282 104 C 282 94 294 84 307 84 Z" 
          fill="url(#spotGradWm)"/>

    <!-- Letter 'o' as the Pin Circle Badge -->
    <g transform="translate(362, 59)">
      <circle cx="44" cy="45" r="44" fill="url(#spotGradWm)" filter="url(#softGlowWm)"/>
      <path d="M 44 21 
               C 31 21, 21 31, 21 44 
               C 21 57, 39 74, 44 78 
               C 49 74, 67 57, 67 44 
               C 67 31, 57 21, 44 21 Z" 
            fill="#FFFFFF"/>
      <circle cx="44" cy="42" r="8" fill="url(#spotGradWm)"/>
    </g>

    <!-- Letter 't' -->
    <path d="M 470 38 C 465 38 461 42 461 47 L 461 64 L 448 64 C 443 64 439 68 439 73 C 439 78 443 82 448 82 L 461 82 L 461 125 C 461 137 470 144 483 144 C 489 144 495 142 499 139 C 503 136 504 130 501 125 C 497 121 492 120 487 123 C 484 125 481 126 478 126 C 474 126 471 123 471 119 L 471 82 L 493 82 C 498 82 502 78 502 73 C 502 68 498 64 493 64 L 471 64 L 471 47 C 471 42 467 38 472 38 Z" 
          fill="url(#spotGradWm)"/>
  </g>
</svg>
